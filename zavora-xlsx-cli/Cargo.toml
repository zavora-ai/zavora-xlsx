[package]
name = "zavora-xlsx-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "CLI tool for inspecting, exporting, and converting Excel xlsx files"
repository = "https://github.com/zavora-ai/zavora-xlsx"
homepage = "https://zavora.ai"
authors = ["James Karanja Maina"]
readme = "README.md"
keywords = ["excel", "xlsx", "cli", "csv"]
categories = ["command-line-utilities"]

[[bin]]
name = "zavora-xlsx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
zavora-xlsx = { path = "..", version = "0.1.0" }

[dev-dependencies]
proptest = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
