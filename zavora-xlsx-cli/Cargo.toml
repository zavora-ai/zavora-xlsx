[package]
name = "zavora-xlsx-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for inspecting, exporting, and converting Excel xlsx files"

[[bin]]
name = "zavora-xlsx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
zavora-xlsx = { path = ".." }

[dev-dependencies]
proptest = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
