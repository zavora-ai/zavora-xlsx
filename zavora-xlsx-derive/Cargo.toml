[package]
name = "zavora-xlsx-derive"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Derive macro for zavora-xlsx ExcelRow"
repository = "https://github.com/zavora-ai/zavora-xlsx"
homepage = "https://zavora.ai"
authors = ["James Karanja Maina"]
readme = "README.md"
keywords = ["excel", "xlsx", "derive", "macro"]
categories = ["parser-implementations"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
zavora-xlsx = { path = ".." }
trybuild = "1"
proptest = "1"
